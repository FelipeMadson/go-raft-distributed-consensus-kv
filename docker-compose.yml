version: '3.8'

services:
  raft-node-0:
    build: .
    container_name: raft-kv-node-0
    ports:
      - "8080:8080"
    environment:
      - NODE_ID=0
      - PEERS=1,2
      - PORT=8080
    restart: unless-stopped

  raft-node-1:
    build: .
    container_name: raft-kv-node-1
    ports:
      - "8081:8080"
    environment:
      - NODE_ID=1
      - PEERS=0,2
      - PORT=8080
    restart: unless-stopped

  raft-node-2:
    build: .
    container_name: raft-kv-node-2
    ports:
      - "8082:8080"
    environment:
      - NODE_ID=2
      - PEERS=0,1
      - PORT=8080
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: raft-kv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
